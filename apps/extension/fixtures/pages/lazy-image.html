<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>懒加载图片夹具</title>

      body {
        min-height: 120vh;
        margin: 0;
        padding: 32px;
        font-family: system-ui, sans-serif;
      }
      img {
        width: 340px;
        aspect-ratio: 4 / 5;
        object-fit: cover;

    />

</html>
